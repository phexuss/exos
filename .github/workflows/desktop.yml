name: Desktop app

# Builds the Electron app in desktop/ for Windows, macOS and Linux and uploads
# the installers as workflow artifacts (unsigned, for testing).
on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win
          - os: macos-latest
            name: mac
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      VITE_API_URL: https://exos-api.phexuss.dev/api
      # No signing certificates yet; build unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --${{ matrix.name }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: exos-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.tar.gz
