name: Desktop app

# Builds the Tauri app in desktop/ for Windows, macOS and Linux and uploads
# the installers as workflow artifacts (unsigned, for testing).
on:
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            name: linux
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      VITE_API_URL: https://exos-api.phexuss.dev/api
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
      - run: npm run typecheck
      - run: npx tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: exos-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
