# Weekly dependency updates. Minor and patch bumps come grouped as one PR per
# app; major bumps come one per package, since those can break things.
# apps/mobile is left out while the Android app is on hold.
version: 2

updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(desktop)"
    groups:
      desktop-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(api)"
    groups:
      api-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(web)"
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(api)"
    ignore:
      # Stay on Node 22 LTS until a deliberate upgrade.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
