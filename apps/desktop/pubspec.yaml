name: exos_desktop
description: "EXØS for Windows, macOS and Linux."
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.7
  crypto: ^3.0.6
  file_selector: ^1.0.3
  http: ^1.4.0
  lucide_icons_flutter: ">=3.1.25 <3.2.0"
  media_kit: ^1.2.0
  media_kit_libs_audio: ^1.0.6
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  shaders:
    - shaders/ambient.frag
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Light.ttf
          weight: 300
        - asset: assets/fonts/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jost-Medium.ttf
          weight: 500
        - asset: assets/fonts/Jost-Bold.ttf
          weight: 700
        - asset: assets/fonts/Jost-Black.ttf
          weight: 900
